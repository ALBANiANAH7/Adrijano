<body>
  <h2>Würfel Spiel ganz unten</h2> <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
<body>
  <!-- Jumping Block Spiel für PC & Handy -->
<div id="gameArea" style="position:relative; width:500px; height:200px; border:2px solid black; margin:20px auto; overflow:hidden; background:#cceeff;">
  <div id="player" style="width:30px; height:30px; background:red; position:absolute; bottom:0; left:50px; border-radius:5px; box-shadow:0 0 10px red;"></div>
  <div id="obstacle" style="width:20px; height:40px; background:black; position:absolute; bottom:0; right:0; border-radius:3px; box-shadow:0 0 10px black;"></div>
  <div id="powerUp" style="width:20px; height:20px; background:gold; position:absolute; border-radius:50%; display:none; box-shadow:0 0 10px gold; animation: spin 1s linear infinite;"></div>
</div>

<p style="text-align:center;">Punkte: <span id="score">0</span></p>
<p style="text-align:center;" id="gameOverMsg"></p>
<p style="text-align:center; font-size:14px; color:gray;">PC: Leertaste | Handy: Tippen zum Springen</p>

<style>
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes jumpGlow {
    0% { box-shadow:0 0 10px red; }
    50% { box-shadow:0 0 25px yellow; }
    100% { box-shadow:0 0 10px red; }
  }
</style>

<script>
const player = document.getElementById("player");
const obstacle = document.getElementById("obstacle");
const powerUp = document.getElementById("powerUp");
const scoreDisplay = document.getElementById("score");
const gameOverMsg = document.getElementById("gameOverMsg");

let isJumping = false;
let playerBottom = 0;
let score = 0;
let gameOver = false;
let obstacleSpeed = 5;

// Partikel Effekt beim Sprung
function createParticles() {
  const particle = document.createElement("div");
  particle.style.width = particle.style.height = Math.random()*8 + "px";
  particle.style.background = "yellow";
  particle.style.position = "absolute";
  particle.style.left = 50 + Math.random()*30 + "px";
  particle.style.bottom = playerBottom + "px";
  particle.style.borderRadius = "50%";
  particle.style.opacity = 1;
  gameArea.appendChild(particle);

  let particleInterval = setInterval(() => {
    particle.style.bottom = parseFloat(particle.style.bottom) + 2 + "px";
    particle.style.opacity -= 0.05;
    if(parseFloat(particle.style.opacity) <= 0){
      clearInterval(particleInterval);
      particle.remove();
    }
  }, 20);
}

function jump() {
  if (isJumping || gameOver) return;
  isJumping = true;
  player.style.animation = "jumpGlow 0.4s";
  createParticles();
  let upInterval = setInterval(() => {
    if (playerBottom >= 80) {
      clearInterval(upInterval);
      let downInterval = setInterval(() => {
        if (playerBottom <= 0) {
          clearInterval(downInterval);
          isJumping = false;
          player.style.animation = "";
        }
        playerBottom -= 5;
        player.style.bottom = playerBottom + "px";
      }, 20);
    }
    playerBottom += 5;
    player.style.bottom = playerBottom + "px";
  }, 20);
}

// PC: Leertaste
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") jump();
});

// Handy: Tippen auf Spielbereich
document.getElementById("gameArea").addEventListener("touchstart", jump);

function randomPowerUp() {
  if (gameOver) return;
  powerUp.style.display = "block";
  const maxX = 480;
  const maxY = 150;
  powerUp.style.left = Math.floor(Math.random() * maxX) + "px";
  powerUp.style.top = Math.floor(Math.random() * maxY) + "px";

  setTimeout(() => {
    powerUp.style.display = "none";
  }, 5000);
}

function moveObstacle() {
  let obstacleLeft = 500;
  const obstacleInterval = setInterval(() => {
    if (gameOver) {
      clearInterval(obstacleInterval);
      return;
    }
    obstacleLeft -= obstacleSpeed;
    obstacle.style.left = obstacleLeft + "px";

    // Kollision prüfen
    if (obstacleLeft < 80 && obstacleLeft > 50 && playerBottom < 40) {
      gameOverMsg.textContent = "💀 Game Over! Reload die Seite um neu zu starten.";
      gameOver = true;
    }

    // Punkt & Geschwindigkeit erhöhen
    if (obstacleLeft <= 0) {
      score++;
      scoreDisplay.textContent = score;
      obstacleLeft = 500;
      obstacleSpeed += 0.2;
      if (Math.random() < 0.3) randomPowerUp();
    }

    // PowerUp Kollision
    const powerLeft = parseInt(powerUp.style.left || 0);
    const powerTop = parseInt(powerUp.style.top || 0);
    if (powerUp.style.display === "block" &&
        playerBottom < powerTop + 20 &&
        playerBottom + 30 > powerTop &&
        50 < powerLeft + 20 &&
        50 + 30 > powerLeft) {
      score += 3;
      scoreDisplay.textContent = score;
      powerUp.style.display = "none";
    }
  }, 20);
}

moveObstacle();
</script>
</body>
